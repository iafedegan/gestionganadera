<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F2F7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gestión Ganadera" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Sistema Integral de Gestión Ganadera</title>
  </head>
  <body>
    <style>
      body { margin: 0; }
      .splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center;
        gap: 14px; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        background: radial-gradient(120% 80% at 50% 0%, #14553d 0%, #0f3d2e 55%, #092a1f 100%); color: #f4f2e9;
        font-family: Georgia, serif; text-align: center; }
      .splash i { width: 84px; height: 84px; border-radius: 50%; background: #f6f8f3; margin-bottom: 6px;
        box-shadow: inset 0 0 0 15px #0f3d2e, inset 0 0 0 22px #d8b558, 0 0 0 3px rgb(216 181 88 / .35),
          0 18px 40px -12px rgb(0 0 0 / .5);
        animation: splash-pulse 1.6s ease-in-out infinite; }
      .splash p { margin: 0; font-size: 1.6rem; letter-spacing: .02em; }
      .splash small { font: 500 .95rem/1.3 system-ui, -apple-system, sans-serif; color: #d8b558; }
      .splash .splash-bar { width: 120px; height: 3px; margin-top: 18px; border-radius: 3px; overflow: hidden;
        background: rgb(255 255 255 / .15) linear-gradient(90deg, transparent, #d8b558, transparent) no-repeat;
        background-size: 50% 100%; animation: splash-bar 1.2s ease-in-out infinite; }
      @keyframes splash-pulse { 50% { transform: scale(1.06); opacity: .85; } }
      @keyframes splash-bar { from { background-position: -100% 0; } to { background-position: 200% 0; } }
      @media (prefers-reduced-motion: reduce) { .splash, .splash i, .splash .splash-bar { animation: none; } }
    </style>
    <div id="root"><div class="splash"><i></i><p>Gestión Ganadera</p><small>Su finca ordenada, con o sin señal</small><span class="splash-bar"></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
