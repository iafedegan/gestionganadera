<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F2F7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GanSmart" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <title>GanSmart</title>
  </head>
  <body>
    <style>
      body { margin: 0; }
      .splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center;
        gap: 14px; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        background: #112810; color: #f4f2e9;
        font-family: Georgia, serif; text-align: center; }
      .splash img { width: min(340px, 84vw); height: auto; animation: splash-pulse 1.8s ease-in-out infinite; }
      .splash p { margin: 0; font-size: 1.6rem; letter-spacing: .02em; }
      .splash small { font: 500 .95rem/1.3 system-ui, -apple-system, sans-serif; color: #d8b558; }
      .splash .splash-bar { width: 120px; height: 3px; margin-top: 18px; border-radius: 3px; overflow: hidden;
        background: rgb(255 255 255 / .15) linear-gradient(90deg, transparent, #d8b558, transparent) no-repeat;
        background-size: 50% 100%; animation: splash-bar 1.2s ease-in-out infinite; }
      @keyframes splash-pulse { 50% { transform: scale(1.06); opacity: .85; } }
      @keyframes splash-bar { from { background-position: -100% 0; } to { background-position: 200% 0; } }
      @media (prefers-reduced-motion: reduce) { .splash, .splash i, .splash .splash-bar { animation: none; } }
    </style>
    <div id="root"><div class="splash"><img src="/app/logo.png" alt="GanSmart, inteligencia y control" /><small>Su finca ordenada, con o sin señal</small><span class="splash-bar"></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
